# =========================================================
# TeamSurvival - config (SR)
# Sve vrednosti su u sekundama, osim gde piše drugačije.
# =========================================================

# -------------------------
# TEAM SETUP
# -------------------------
teams:
  # Maksimalno igrača u timu
  maxTeamSize: 3

  # Ako je prazno -> svi svetovi dozvoljeni
  allowedWorlds: []

  # Pravila za ime tima
  teamNameMinLength: 2
  teamNameMaxLength: 16
  # Dozvoljeno: slova/brojevi/_/-
  teamNamePattern: "^[A-Za-z0-9_\\-]+$"

economy:
  starting-coins: 500

  starter-abuse:
    once-ever: true
    cooldown-hours: 72
# -------------------------
# INVITES
# -------------------------
invites:
  # Koliko dugo poziv važi
  inviteExpireSeconds: 60


# -------------------------
# TEAM HOME / TELEPORT
# -------------------------
home:
  # Cooldown za /tim sethome (po timu)
  homeCooldownSeconds: 600

  # Warmup za /tim home
  homeWarmupSeconds: 5

  # Cooldown za /tim home (po igraču)
  homeTeleportCooldownSeconds: 120


# -------------------------
# RESPAWN
# -------------------------
respawn:
  # true = respawn ide na team home (ako postoji)
  respawnToTeamHome: true


# -------------------------
# TPA (TEAM TELEPORT REQUEST)
# -------------------------
tpa:
  # Cooldown za slanje/teleport nakon uspeha (po requester-u)
  tpaCooldownSeconds: 180

  # Istek zahteva
  tpaExpireSeconds: 60

  # Warmup nakon /tim tpaccept
  tpaWarmupSeconds: 5


# -------------------------
# GLOBAL WARMUP RULES
# -------------------------
warmup:
  # Ako igrač tokom warmup-a pomeri više od ove distance -> cancel
  cancelMoveDistanceBlocks: 0.2


# -------------------------
# COMBAT TAG
# -------------------------
combat:
  # Koliko traje combat-tag od poslednjeg damage-a
  combatTagSeconds: 15


# -------------------------
# FRIENDLY FIRE
# -------------------------
friendlyFire:
  # false = OFF (blokira damage između teammate-ova)
  friendlyFireEnabled: false

  # true = strogo blokira i TNT sa player source protiv teammate-a
  friendlyFireStrictExplosions: true


# -------------------------
# /PING SETTINGS
# -------------------------
ping:
  # true = pokazuje koordinate u /ping (ako plugin to koristi)
  showCoordinatesInPing: false


# -------------------------
# LOCATOR (ACTIONBAR TEAMMATES)
# -------------------------
locator:
  enabled: true
  # 20 ticks = 1 sekund
  intervalTicks: 20
  # Koliko teammate-ova maksimalno prikazati u ActionBar-u
  maxEntries: 4


# -------------------------
# SCOREBOARD TEAMS / COLORS
# -------------------------
scoreboard:
  enabled: true

  # Fix "zalepjenih boja": briše sve ts_ timove na enable
  resetOnEnable: true

  # Sync na PlayerJoin (da odmah dobije boju)
  syncOnJoin: true

  # Prefix za scoreboard teamove
  teamPrefix: "ts_"

  # Deterministička paleta boja (persistuje se kao colorName u teams.yml)
  colorPalette:
    - AQUA
    - GREEN
    - YELLOW
    - LIGHT_PURPLE
    - GOLD
    - BLUE
    - RED
    - DARK_AQUA
    - DARK_GREEN
    - DARK_PURPLE
    - DARK_BLUE
    - DARK_RED


# -------------------------
# DATA SAVE / PERSISTENCE
# -------------------------
persistence:
  # Debounce: 40 ticks = 2s
  debounceSaveTicks: 40

  # Failsafe periodic save: 6000 ticks = 5 min
  periodicSaveTicks: 6000


# =========================================================
# REWARDS SYSTEM (periodične nagrade)
# =========================================================
rewards:
  enabled: true

  # Na koliko sekundi se dodeljuju nagrade
  intervalSeconds: 1800

  # true = SVAKI online igrač dobije nagradu na interval
  # false = samo 1 random igrač dobije nagradu na interval
  giveToAllOnline: false

  # Ako je reward KIT (više itema), a ti ne staviš "display",
  # ovo će se koristiti kao fallback.
  kitDisplayFallback: "&bSpecijalni kit"

  fireworks:
    enabled: true
    radius: 6

    # Koliko vatrometa ide po rarity (možeš da pumpaš brutalno)
    byRarity:
      common: 4
      uncommon: 8
      rare: 14
      epic: 22
      legendary: 35
      mythic: 55

  # Nagrade (WEIGHT = šansa; veći weight = češće)
  items:
