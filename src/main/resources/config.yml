# =========================================================
# TeamSurvival - config.yml (SR)
# Verzija: 4.2
#
# ✅ Sve vrednosti u sekundama, osim gde piše drugačije.
# ✅ Boje u porukama koriste Minecraft color codes sa &.
# ✅ Ako ostaviš listu praznu: [] znači "bez ograničenja".
# =========================================================

# ---------------------------------------------------------
# 1) TEAM SETUP
# ---------------------------------------------------------
teams:
  # Maksimalno igrača u timu
  maxTeamSize: 3

  # Ako je prazno -> svi svetovi su dozvoljeni
  # Primer: ["world", "world_nether", "world_the_end"]
  allowedWorlds: []

  # Pravila za ime tima
  teamNameMinLength: 2
  teamNameMaxLength: 16

  # Regex: Dozvoljeno samo slova/brojevi/_/-
  # (bez razmaka, č, ć, š itd.)
  teamNamePattern: "^[A-Za-z0-9_\\-]+$"


# ---------------------------------------------------------
# 2) ECONOMY (TEAM COINS)
# ---------------------------------------------------------
economy:
  # Koliko coins dobije novi tim/igrač na startu
  starting-coins: 500

  # Anti abuse: zaštita da starter coins ne mogu da se farmuju
  starter-abuse:
    once-ever: true
    cooldown-hours: 72


  # -------------------------------------------------------
  # 2.1) EARNINGS (Coins dok igraš)
  # -------------------------------------------------------
  earnings:
    enabled: true

    # Globalni multiplikator za sve nagrade
    global-multiplier: 1.0

    # Poruka u ActionBar-u kad dobije coins
    actionbar:
      enabled: true
      min-coins-to-show: 1

    # -----------------------------------------------------
    # Diminishing Returns (anti-spam / anti-farm)
    # -----------------------------------------------------
    diminishing:
      enabled: true
      window-seconds: 600
      half-life-actions: 80
      min-factor: 0.15
      per-category: true

    # -----------------------------------------------------
    # Anti-Farm: Place -> Break loop
    # -----------------------------------------------------
    anti-farm:
      placed-block-ttl-seconds: 1800
      placed-block-factor: 0.0

    # -----------------------------------------------------
    # MINING / BREAKING
    # -----------------------------------------------------
    mining:
      enabled: true
      default: 0.05
      materials:
        STONE: 0.02
        DEEPSLATE: 0.02

        COAL_ORE: 1.5
        COPPER_ORE: 1.0
        IRON_ORE: 2.0
        GOLD_ORE: 3.0

        REDSTONE_ORE: 2.0
        LAPIS_ORE: 2.0

        DIAMOND_ORE: 8.0
        EMERALD_ORE: 10.0
        ANCIENT_DEBRIS: 25.0

    # -----------------------------------------------------
    # BUILDING / PLACING
    # -----------------------------------------------------
    building:
      enabled: true
      default: 0.02
      materials:
        OAK_PLANKS: 0.03
        SPRUCE_PLANKS: 0.03
        COBBLESTONE: 0.02
        STONE_BRICKS: 0.04
        GLASS: 0.05
        TORCH: 0.01

    # -----------------------------------------------------
    # FARMING (zreli cropovi)
    # -----------------------------------------------------
    farming:
      enabled: true
      mature-crop: 0.5
      crops:
        WHEAT: 0.5
        CARROTS: 0.5
        POTATOES: 0.5
        BEETROOTS: 0.5
        NETHER_WART: 1.0

    # -----------------------------------------------------
    # HUNTING / MOB KILLS
    # -----------------------------------------------------
    hunting:
      enabled: true
      default: 0.2
      entities:
        ZOMBIE: 0.3
        SKELETON: 0.35
        CREEPER: 0.5
        ENDERMAN: 1.0
        BLAZE: 0.8
        WITHER_SKELETON: 1.2

    # -----------------------------------------------------
    # FISHING
    # -----------------------------------------------------
    fishing:
      enabled: true
      per-catch: 0.6

    # -----------------------------------------------------
    # CRAFTING
    # -----------------------------------------------------
    crafting:
      enabled: true
      default: 0.05
      items:
        TORCH: 0.02
        CHEST: 0.1
        FURNACE: 0.1
        ENCHANTING_TABLE: 2.0

    # -----------------------------------------------------
    # SMELTING (vadjenje iz peći)
    # -----------------------------------------------------
    smelting:
      enabled: true
      default: 0.05
      items:
        IRON_INGOT: 0.2
        GOLD_INGOT: 0.3

    # -----------------------------------------------------
    # EXPLORING (kretanje / distanca)
    # -----------------------------------------------------
    exploring:
      enabled: true
      blocks-per-reward: 120
      coins-per-reward: 0.4


# ---------------------------------------------------------
# 3) INVITES (pozivi u tim)
# ---------------------------------------------------------
invites:
  inviteExpireSeconds: 60


# ---------------------------------------------------------
# 4) TEAM HOME / TELEPORT
# ---------------------------------------------------------
home:
  homeCooldownSeconds: 600
  homeWarmupSeconds: 5
  homeTeleportCooldownSeconds: 120


# ---------------------------------------------------------
# 5) RESPAWN
# ---------------------------------------------------------
respawn:
  # IMPORTANT: ovo je key koji Settings.java čita
  respawnToTeamHome: true

  anti_spawn_camp:
    enabled: true
    window_seconds: 300
    kills_threshold: 3
    only_if_team_home: true

    # ✅ NOVO: ako true -> random respawn unutar worldborder-a
    random_within_worldborder: true

    border_margin_blocks: 32
    max_tries: 40


# ---------------------------------------------------------
# 6) TPA (Team Teleport Request)
# ---------------------------------------------------------
tpa:
  tpaCooldownSeconds: 180
  tpaExpireSeconds: 60
  tpaWarmupSeconds: 5


# ---------------------------------------------------------
# 7) GLOBAL WARMUP RULES
# ---------------------------------------------------------
warmup:
  cancelMoveDistanceBlocks: 0.2


# ---------------------------------------------------------
# 8) COMBAT TAG
# ---------------------------------------------------------
combat:
  combatTagSeconds: 15


# ---------------------------------------------------------
# 9) FRIENDLY FIRE
# ---------------------------------------------------------
friendlyFire:
  friendlyFireEnabled: false
  friendlyFireStrictExplosions: true


# ---------------------------------------------------------
# 10) /PING SETTINGS
# ---------------------------------------------------------
ping:
  showCoordinatesInPing: true


# ---------------------------------------------------------
# 11) LOCATOR (ActionBar teammate info)
# ---------------------------------------------------------
locator:
  enabled: true
  intervalTicks: 20
  maxEntries: 4


# ---------------------------------------------------------
# 12) SCOREBOARD TEAMS / COLORS
# ---------------------------------------------------------
scoreboard:
  enabled: true
  resetOnEnable: true
  syncOnJoin: true
  teamPrefix: "ts_"
  colorPalette:
    - AQUA
    - GREEN
    - YELLOW
    - LIGHT_PURPLE
    - GOLD
    - BLUE
    - RED
    - DARK_AQUA
    - DARK_GREEN
    - DARK_PURPLE
    - DARK_BLUE
    - DARK_RED


# ---------------------------------------------------------
# 13) DATA SAVE / PERSISTENCE
# ---------------------------------------------------------
persistence:
  debounceSaveTicks: 40
  periodicSaveTicks: 6000


# =========================================================
# 14) REWARDS SYSTEM (periodične nagrade)
# =========================================================
rewards:
  enabled: true
  intervalSeconds: 1800
  giveToAllOnline: false
  kitDisplayFallback: "&bSpecijalni kit"

  fireworks:
    enabled: true
    radius: 6
    byRarity:
      common: 4
      uncommon: 8
      rare: 14
      epic: 22
      legendary: 35
      mythic: 55

  items:
    # -------------------------
    # COMMON
    # -------------------------
    - id: iron
      type: ITEM
      material: IRON_INGOT
      minAmount: 1
      maxAmount: 6
      weight: 60
      rarity: COMMON

    - id: coal
      type: ITEM
      material: COAL
      minAmount: 4
      maxAmount: 16
      weight: 55
      rarity: COMMON

    - id: arrows
      type: ITEM
      material: ARROW
      minAmount: 8
      maxAmount: 32
      weight: 45
      rarity: COMMON

    - id: steak
      type: ITEM
      material: COOKED_BEEF
      minAmount: 6
      maxAmount: 24
      weight: 45
      rarity: COMMON

    # -------------------------
    # UNCOMMON
    # -------------------------
    - id: gold
      type: ITEM
      material: GOLD_INGOT
      minAmount: 1
      maxAmount: 6
      weight: 28
      rarity: UNCOMMON

    - id: lapis
      type: ITEM
      material: LAPIS_LAZULI
      minAmount: 8
      maxAmount: 32
      weight: 26
      rarity: UNCOMMON

    - id: enderpearls
      type: ITEM
      material: ENDER_PEARL
      minAmount: 1
      maxAmount: 6
      weight: 18
      rarity: UNCOMMON

    - id: xp_bottles
      type: ITEM
      material: EXPERIENCE_BOTTLE
      minAmount: 8
      maxAmount: 32
      weight: 16
      rarity: UNCOMMON

    # -------------------------
    # RARE
    # -------------------------
    - id: diamonds
      type: ITEM
      material: DIAMOND
      minAmount: 1
      maxAmount: 3
      weight: 10
      rarity: RARE

    - id: emeralds
      type: ITEM
      material: EMERALD
      minAmount: 2
      maxAmount: 6
      weight: 9
      rarity: RARE

    - id: totem
      type: ITEM
      material: TOTEM_OF_UNDYING
      minAmount: 1
      maxAmount: 1
      weight: 3
      rarity: RARE
      display: "&eTotem of Undying"

    - id: shulker
      type: ITEM
      material: SHULKER_BOX
      minAmount: 1
      maxAmount: 1
      weight: 3
      rarity: RARE
      display: "&dShulker Box"

    # -------------------------
    # EPIC
    # -------------------------
    - id: enchanted_gapples
      type: ITEM
      material: ENCHANTED_GOLDEN_APPLE
      minAmount: 1
      maxAmount: 2
      weight: 2
      rarity: EPIC
      display: "&6Enchanted Golden Apple"

    - id: netherite_ingot
      type: ITEM
      material: NETHERITE_INGOT
      minAmount: 1
      maxAmount: 1
      weight: 2
      rarity: EPIC
      display: "&8Netherite Ingot"

    - id: trident
      type: ITEM
      material: TRIDENT
      minAmount: 1
      maxAmount: 1
      weight: 1
      rarity: EPIC
      display: "&bTrident"

    # -------------------------
    # LEGENDARY (KIT)
    # -------------------------
    - id: diamond_armor_full
      type: KIT
      weight: 1
      rarity: LEGENDARY
      display: "&b&lDiamond Armor FULL SET"
      items:
        - material: DIAMOND_HELMET
          amount: 1
        - material: DIAMOND_CHESTPLATE
          amount: 1
        - material: DIAMOND_LEGGINGS
          amount: 1
        - material: DIAMOND_BOOTS
          amount: 1

    - id: elytra
      type: ITEM
      material: ELYTRA
      minAmount: 1
      maxAmount: 1
      weight: 1
      rarity: LEGENDARY
      display: "&d&lKRILA (ELYTRA)"

    - id: beacon
      type: ITEM
      material: BEACON
      minAmount: 1
      maxAmount: 1
      weight: 1
      rarity: LEGENDARY
      display: "&f&lBeacon"

    # -------------------------
    # MYTHIC (KIT)
    # -------------------------
    - id: netherite_armor_full
      type: KIT
      weight: 1
      rarity: MYTHIC
      display: "&5&lNETHERITE FULL SET (GODLIKE)"
      message: "&7[&5💎&7] &5&lULTRA RARE! &f%player% &7je dobio &5&l%reward%&7!!!"
      items:
        - material: NETHERITE_HELMET
          amount: 1
        - material: NETHERITE_CHESTPLATE
          amount: 1
        - material: NETHERITE_LEGGINGS
          amount: 1
