      type: ITEM
      material: GOLD_INGOT
      minAmount: 1
      maxAmount: 6
      weight: 28
      rarity: UNCOMMON

    - id: lapis
      type: ITEM
      material: LAPIS_LAZULI
      minAmount: 8
      maxAmount: 32
      weight: 26
      rarity: UNCOMMON

    - id: enderpearls
      type: ITEM
      material: ENDER_PEARL
      minAmount: 1
      maxAmount: 6
      weight: 18
      rarity: UNCOMMON

    - id: xp_bottles
