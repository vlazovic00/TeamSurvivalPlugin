# =========================================================
# 15) SUPPLY DROPS (random chest u border-u)
# =========================================================
supplyDrops:
  enabled: true
  world: ""
  intervalSeconds: 3600
  expireSeconds: 600
  expireWarningsSeconds: [60, 30, 10]

  messages:
    expireWarning: "&6&l[SUPPLY] &eSupply chest će biti obrisan za &c%time%&e ako ga niko ne otvori!"
    expired: "&6&l[SUPPLY] &cSupply chest je istekao i obrisan je."

  borderMarginBlocks: 8
  removeAfterOpenSeconds: 10
  maxRadiusBlocks: 2000
  preferNearPlayers: false

  titles:
    spawn:
      title: "&6&lSUPPLY DROP!"
      subtitle: "&ePao je supply u worldborder-u!"
      fadeInTicks: 50
      stayTicks: 100
      fadeOutTicks: 50

  fireworks:
    durationSeconds: 6
    everyTicks: 2
    perBurst: 2

  loot:
    minItems: 1
    maxItems: 2
    items:
      - material: NETHERITE_SWORD
        amount: 1
        name: "&c&lOP Sword"
        lore:
          - "&7Sharpness V"
          - "&7Unbreaking III"
        enchants:
          DAMAGE_ALL: 5
          DURABILITY: 3
        unbreakable: true
        hideFlags: true

      - material: ENCHANTED_GOLDEN_APPLE
        minAmount: 2
        maxAmount: 6

      - material: NETHERITE_CHESTPLATE
        amount: 1
        name: "&5&lOP Chestplate"
        enchants:
          PROTECTION_ENVIRONMENTAL: 5
          DURABILITY: 3
        unbreakable: true
        hideFlags: true

      - material: TOTEM_OF_UNDYING
        minAmount: 1
        maxAmount: 2

      - material: NETHERITE_INGOT
        minAmount: 2
        maxAmount: 6


# ---------------------------------------------------------
# CLAIMS (Chunk claiming)
# ---------------------------------------------------------
claims:
  enabled: true
  price-per-chunk: 200
  only-leader-can-claim: true
  max-claims-per-team: 0
  foreign-open-enabled: true

  protection:
    block-break: true
    block-place: true
    block-explosions: true
    pistons: true
    enderman-grief: true
    hanging-break: true