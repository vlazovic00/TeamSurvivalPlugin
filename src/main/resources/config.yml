      type: ITEM
      material: IRON_INGOT
      minAmount: 1
      maxAmount: 6
      weight: 60
      rarity: COMMON

    - id: coal
      type: ITEM
      material: COAL
      minAmount: 4
      maxAmount: 16
      weight: 55
      rarity: COMMON

    - id: arrows
