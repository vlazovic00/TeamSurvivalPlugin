# =========================================================
# SUPPLY DROPS (random chest u border-u)
# =========================================================
supplyDrops:
  enabled: true

  # Ako ostaviš prazno -> uzme prvi world sa servera
  world: ""

  # Na koji interval se spawnuje supply chest
  intervalSeconds: 3600

  # Ako niko ne otvori chest, briše se posle X sekundi
  expireSeconds: 600

  # U kojim trenucima (sekunde pre brisanja) da šalje upozorenje
  expireWarningsSeconds: [60, 30, 10]

  messages:
    expireWarning: "&6&l[SUPPLY] &eSupply chest će biti obrisan za &c%time%&e ako ga niko ne otvori!"
    expired: "&6&l[SUPPLY] &cSupply chest je istekao i obrisan je."

  # Koliko blokova unutra od border-a (da ne padne baš na ivicu)
  borderMarginBlocks: 8

  # Koliko sekundi nakon otvaranja chest nestaje
  removeAfterOpenSeconds: 10

  # Hard cap koliko daleko od centra/igraca sme da baci drop
  # (da ne ode na milione blokova)
  maxRadiusBlocks: 2000

  # true = spawn oko igraca (najbezbednije)
  # false = spawn oko world spawna
  preferNearPlayers: false

  titles:
    spawn:
      title: "&6&lSUPPLY DROP!"
      subtitle: "&ePao je supply u worldborder-u!"
      fadeInTicks: 10
      stayTicks: 60
      fadeOutTicks: 10

  fireworks:
    # Koliko dugo traje spam vatrometa
    durationSeconds: 6
    # Na koliko tickova puca novi burst (manje = jače)
    everyTicks: 2
    # Koliko vatrometa po burst-u
    perBurst: 2

  loot:
    # Koliko itema ukupno ubaci u chest (random između min i max)
    minItems: 1
    maxItems: 2

    # Lista itema koji mogu da se pojave u chestu
    items:
      - material: NETHERITE_SWORD
        amount: 1
        name: "&c&lOP Sword"
        lore:
          - "&7Sharpness V"
          - "&7Unbreaking III"
        enchants:
          DAMAGE_ALL: 5
          DURABILITY: 3
        unbreakable: true
        hideFlags: true

      - material: ENCHANTED_GOLDEN_APPLE
        minAmount: 2
        maxAmount: 6

      - material: NETHERITE_CHESTPLATE
        amount: 1
        name: "&5&lOP Chestplate"
        enchants:
          PROTECTION_ENVIRONMENTAL: 5
          DURABILITY: 3
        unbreakable: true
        hideFlags: true

      - material: TOTEM_OF_UNDYING
        minAmount: 1
        maxAmount: 2

      - material: NETHERITE_INGOT
        minAmount: 2
        maxAmount: 6